name: Game template CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - run: npm run package
      - name: Downloadable game ZIP
        uses: actions/upload-artifact@v4
        with:
          name: legendary-quest-package
          path: release/legendary-quest-for-vocabulary.zip
          if-no-files-found: error
          retention-days: 30
      - name: Browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 14
